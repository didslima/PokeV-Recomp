name: Build PokeV-Recomp (Windows & Linux)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  windows:
    name: Windows x64 Build
    runs-on: windows-2022
    steps:
      - name: Configure Git Line Endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSYS2 UCRT64 Toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          cache: true
          install: >-
            make
            nasm
            diffutils
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-vulkan-devel
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-spirv-tools
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-vulkan-memory-allocator
            mingw-w64-ucrt-x86_64-opus

      - name: Configure Windows UCRT64 PATH
        shell: bash
        run: |
          set -euo pipefail
          UCRT_DIR=""
          for candidate in \
            "/d/a/_temp/msys64/ucrt64/bin" \
            "/d/a/_temp/setup-msys2/msys64/ucrt64/bin" \
            "/d/a/_temp/setup-msys2/ucrt64/bin" \
            "/c/msys64/msys64/ucrt64/bin" \
            "/c/msys64/ucrt64/bin" \
            "/c/hostedtoolcache/windows/msys64/ucrt64/bin"; do
            if [ -x "$candidate/clang.exe" ]; then
              UCRT_DIR="$candidate"
              break
            fi
          done
          if [ -z "$UCRT_DIR" ]; then
            UCRT_CLANG=$(find /d/a/_temp /c -maxdepth 5 -name "clang.exe" 2>/dev/null | grep -i "ucrt64/bin/clang.exe" | head -n 1 || true)
            [ -n "$UCRT_CLANG" ] && UCRT_DIR=$(dirname "$UCRT_CLANG")
          fi
          [ -n "$UCRT_DIR" ] || { echo "UCRT64 clang.exe not found"; exit 1; }
          echo "Using UCRT64 toolchain at: $UCRT_DIR"
          echo "$UCRT_DIR" >> "$GITHUB_PATH"
          echo "$(dirname "$UCRT_DIR")/usr/bin" >> "$GITHUB_PATH"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache Windows Dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/deps-win
            !build/deps-win/src
          key: win-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build_deps_windows.sh') }}

      - name: Cache Windows SDK Downloads
        uses: actions/cache@v4
        with:
          path: |
            build/zig-dl
            build/xess-dl
          key: win-sdk-dl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/fetch_zig.sh', 'tools/za/dist.sh') }}

      - name: Configure ccache
        id: ccache-config
        shell: bash
        run: |
          set -euo pipefail
          unset INCLUDE LIB LIBPATH
          CLEAN_PATH=$(echo "$PATH" | tr ':' '\n' | grep -v -i "Program Files/LLVM" | grep -v -i "Windows Kits" | tr '\n' ':')
          export PATH="$CLEAN_PATH"
          CCACHE_DIR="$(cygpath -m "$PWD/build/ccache")"
          CCACHE_BASEDIR="$(cygpath -m "$PWD")"
          mkdir -p "$PWD/build/ccache"
          {
            echo "CC_LAUNCHER=ccache"
            echo "CCACHE_DIR=$CCACHE_DIR"
            echo "CCACHE_BASEDIR=$CCACHE_BASEDIR"
            echo "CCACHE_NOHASHDIR=true"
            echo "CCACHE_COMPILERCHECK=content"
            echo "CCACHE_COMPRESS=true"
            echo "CCACHE_COMPRESSLEVEL=6"
            echo "CCACHE_MAXSIZE=400M"
          } >> "$GITHUB_ENV"
          COMPILER_VER="$(clang --version | head -n 2; clang++ --version | head -n 1)"
          MAKE_FLAGS="$(printf 'pv:\n\t@echo "$(RTFLAGS)|$(CXXFLAGS)|$(UIFLAGS)|$(GENFLAGS)"\n' | make -s -f Makefile -f - DEPS=deps RELEASE=1 GENARCH=-march=x86-64-v3 GENOPT="-O1 -DGUEST_VOLATILE" pv)"
          BUILD_CFG="platform=windows-dist;arch=${{ runner.arch }};os=${{ runner.os }};flags=$MAKE_FLAGS"
          KEY_HASH=$(printf '%s\n%s\n' "$COMPILER_VER" "$BUILD_CFG" | sha256sum | cut -c1-16)
          echo "key=$KEY_HASH" >> "$GITHUB_OUTPUT"

      - name: Cache Compiler Objects (ccache)
        uses: actions/cache@v4
        with:
          path: build/ccache
          key: ccache-win-dist-${{ runner.arch }}-${{ steps.ccache-config.outputs.key }}-${{ github.sha }}
          restore-keys: |
            ccache-win-dist-${{ runner.arch }}-${{ steps.ccache-config.outputs.key }}-

      - name: Build Windows Package
        shell: bash
        run: |
          unset INCLUDE LIB LIBPATH
          CLEAN_PATH=$(echo "$PATH" | tr ':' '\n' | grep -v -i "Program Files/LLVM" | grep -v -i "Windows Kits" | tr '\n' ':')
          export PATH="$CLEAN_PATH"
          ccache -z
          export ZIP=1
          bash tools/za/dist.sh
          ccache -s

      - name: Rename Output Zip
        shell: pwsh
        run: |
          if (Test-Path "build/dist-za/PokeV-Recomp-windows.zip") {
            Move-Item -Force "build/dist-za/PokeV-Recomp-windows.zip" "build/dist-za/PokeV-Recomp-windows-x64.zip"
          } elseif (Test-Path "build/dist-za/ZA-Recomp-windows.zip") {
            Move-Item -Force "build/dist-za/ZA-Recomp-windows.zip" "build/dist-za/PokeV-Recomp-windows-x64.zip"
          }

      - name: Validate Windows ZIP & RecompLauncher CLI Smoke Tests
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          CLEAN_PATH=$(echo "$PATH" | tr ':' '\n' | grep -v -i "Program Files/LLVM" | grep -v -i "Windows Kits" | tr '\n' ':')
          export PATH="$CLEAN_PATH"
          SCHEMA_URL="https://raw.githubusercontent.com/elripalda/RecompLauncher/7d8bc7a59d472402ada20e2fff2fbbf806e10797/docs/recomplauncher.schema.json"
          curl -fsSL "$SCHEMA_URL" -o "$RUNNER_TEMP/recomplauncher.schema.json"
          python -m venv "$RUNNER_TEMP/win-rl-venv"
          "$RUNNER_TEMP/win-rl-venv/Scripts/python.exe" -m pip install -q jsonschema
          "$RUNNER_TEMP/win-rl-venv/Scripts/python.exe" - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import zipfile
          import jsonschema

          zip_path = Path("build/dist-za/PokeV-Recomp-windows-x64.zip")
          assert zip_path.is_file(), f"Missing {zip_path}"

          with zipfile.ZipFile(zip_path, "r") as zf:
              names = set(zf.namelist())
              required = [
                  "PokeV-Recomp/PokeV-Recomp.exe",
                  "PokeV-Recomp/recomplauncher.json",
                  "PokeV-Recomp/zaimport/zaimport.exe",
                  "PokeV-Recomp/zig/zig.exe",
                  "PokeV-Recomp/za-default.ini",
                  "PokeV-Recomp/lasgen/lasgen.exe",
                  "PokeV-Recomp/zaprompts/zaprompts.exe",
                  "PokeV-Recomp/gamelib-src/gamelib_entry.c",
              ]
              for req in required:
                  assert req in names, f"Missing required ZIP entry: {req}"

              dlls = [n for n in names if n.startswith("PokeV-Recomp/") and n.lower().endswith(".dll")]
              assert len(dlls) > 0, "Expected bundled DLLs in PokeV-Recomp/"

              forbidden_substrings = ("x264", "x265", "xvid", "postproc")
              for n in names:
                  low = n.lower()
                  assert not any(bad in low for bad in forbidden_substrings), f"Forbidden GPL library in ZIP: {n}"
                  assert not low.startswith("pokev-recomp/recompdata/"), f"Unexpected recompdata/ in ZIP: {n}"
                  assert low != "pokev-recomp/larecomp.ini", f"Unexpected larecomp.ini in ZIP: {n}"

              with tempfile.TemporaryDirectory() as tmp:
                  tmp_dir = Path(tmp)
                  extract_dir = tmp_dir / "unpacked"
                  zf.extractall(extract_dir)
                  app_dir = extract_dir / "PokeV-Recomp"
                  exe = app_dir / "PokeV-Recomp.exe"
                  assert exe.is_file()

                  # Check DLL resolution using only the unpacked ZIP folder + Windows System32.
                  # dist.sh intentionally excludes vulkan-1.dll (provided by the user's GPU driver);
                  # headless windows-2022 runners lack a GPU driver, so allow only vulkan-1.dll to be
                  # supplied from UCRT64 into the temporary unpacked folder for the smoke test.
                  ldd_env = os.environ.copy()
                  app_dir_posix = subprocess.check_output(["cygpath", "-u", str(app_dir)], text=True).strip()
                  ldd_env["PATH"] = f"{app_dir_posix}:/c/Windows/System32:/c/Windows"
                  ldd_out = subprocess.check_output(["ldd", str(exe)], env=ldd_env, text=True)
                  missing = [line.strip() for line in ldd_out.splitlines() if "not found" in line.lower()]
                  non_vulkan_missing = [
                      m for m in missing
                      if "vulkan-1" not in m.lower()
                      and not m.lower().startswith("api-ms-win-")
                      and not m.lower().startswith("ext-ms-win-")
                  ]
                  assert not non_vulkan_missing, f"Missing bundled DLLs in ZIP:\n{chr(10).join(non_vulkan_missing)}"
                  if any("vulkan-1" in m.lower() for m in missing):
                      import shutil
                      search_dirs = [Path(p) for p in os.environ.get("PATH", "").split(os.pathsep) if p] + [
                          Path(r"D:\a\_temp\msys64\ucrt64\bin"),
                          Path(r"D:\a\_temp\setup-msys2\msys64\ucrt64\bin"),
                          Path(r"C:\msys64\ucrt64\bin"),
                      ]
                      for d in search_dirs:
                          for fname in ("vulkan-1.dll", "libvulkan-1.dll"):
                              cand = d / fname
                              if cand.is_file():
                                  shutil.copy2(cand, app_dir / "vulkan-1.dll")
                                  break
                          if (app_dir / "vulkan-1.dll").is_file():
                              break
                      assert (app_dir / "vulkan-1.dll").is_file(), "Could not locate vulkan-1.dll / libvulkan-1.dll on runner"

                  manifest = json.loads((app_dir / "recomplauncher.json").read_text(encoding="utf-8"))
                  schema = json.loads(Path(os.environ["RUNNER_TEMP"], "recomplauncher.schema.json").read_text(encoding="utf-8"))
                  jsonschema.validate(instance=manifest, schema=schema)
                  assert manifest["repo"] == "didslima/PokeV-Recomp"
                  assert manifest["prepare"]["program"][0] == "PokeV-Recomp.exe"
                  assert manifest["start"]["program"][0] == "PokeV-Recomp.exe"

                  def clean_env(extra):
                      env = os.environ.copy()
                      for k in ("LARECOMP_DATA_ROOT", "RECOMPLAUNCHER_DATA", "LARECOMP_NO_LAUNCHER",
                                "LARECOMP_FORCE_LAUNCHER", "LARECOMP_INPUT", "RECOMPLAUNCHER"):
                          env.pop(k, None)
                      env.update(extra)
                      return env

                  # 1. Headless launcher-bypass smoke test (exit 3 + larecomp.ini creation)
                  data1 = tmp_dir / "data_exit3"
                  r1 = subprocess.run(
                      [str(exe)],
                      cwd=str(app_dir),
                      env=clean_env({
                          "LARECOMP_FORCE_LAUNCHER": "1",
                          "LARECOMP_NO_LAUNCHER": "1",
                          "RECOMPLAUNCHER_DATA": str(data1),
                      }),
                      capture_output=True, text=True, timeout=30,
                  )
                  assert r1.returncode == 3, f"Expected exit 3, got {r1.returncode}\nstdout={r1.stdout}\nstderr={r1.stderr}"
                  assert (data1 / "larecomp.ini").is_file(), "larecomp.ini not created from za-default.ini"
                  log1 = (data1 / "lasrecomp.log").read_text(encoding="utf-8", errors="replace") if (data1 / "lasrecomp.log").is_file() else r1.stderr
                  assert "LARECOMP_NO_LAUNCHER is set" in log1, f"Unexpected log1:\n{log1}"

                  # 2. Headless --play smoke test (skips launcher, resolves RECOMPLAUNCHER_DATA, fails in boot without game files)
                  data2 = tmp_dir / "data_play"
                  r2 = subprocess.run(
                      [str(exe), "--play"],
                      cwd=str(app_dir),
                      env=clean_env({
                          "LARECOMP_NO_LAUNCHER": "1",
                          "RECOMPLAUNCHER": "1",
                          "RECOMPLAUNCHER_DATA": str(data2),
                      }),
                      capture_output=True, text=True, timeout=30,
                  )
                  assert r2.returncode != 0, "Expected non-zero exit when game files are missing"
                  assert (data2 / "larecomp.ini").is_file(), "--play did not initialize larecomp.ini"
                  log2 = (data2 / "lasrecomp.log").read_text(encoding="utf-8", errors="replace") if (data2 / "lasrecomp.log").is_file() else r2.stderr
                  assert "LARECOMP_NO_LAUNCHER is set" not in log2, "--play should skip launcher"

                  # 3. --prepare CLI tests with non-proprietary fixtures
                  data3 = tmp_dir / "prep_missing_game"
                  r3 = subprocess.run(
                      [str(exe), "--prepare", f"--data={data3}"],
                      cwd=str(app_dir), env=clean_env({}), capture_output=True, text=True, timeout=30,
                  )
                  assert r3.returncode == 1, f"Expected exit 1, got {r3.returncode}"
                  assert "No game path provided" in r3.stderr, r3.stderr
                  assert data3.is_dir(), "--data did not create data directory"

                  data4 = tmp_dir / "prep_empty_game"
                  empty_game = tmp_dir / "empty_game"
                  empty_game.mkdir()
                  r4 = subprocess.run(
                      [str(exe), "--prepare", "--data", str(data4), "--game", str(empty_game)],
                      cwd=str(app_dir), env=clean_env({}), capture_output=True, text=True, timeout=30,
                  )
                  assert r4.returncode == 1, f"Expected exit 1, got {r4.returncode}"
                  assert "game files" in r4.stderr.lower(), r4.stderr

                  data5 = tmp_dir / "prep_bad_main"
                  fake_game = tmp_dir / "fake_game"
                  (fake_game / "exefs").mkdir(parents=True)
                  (fake_game / "romfs").mkdir(parents=True)
                  (fake_game / "exefs" / "main").write_bytes(b"NOT_NSO0" * 16)
                  dummy_upd = tmp_dir / "upd.nsp"
                  dummy_upd.write_bytes(b"")
                  dummy_keys = tmp_dir / "prod.keys"
                  dummy_keys.write_bytes(b"")
                  r5 = subprocess.run(
                      [str(exe), "--prepare", f"--data={data5}", f"--game={fake_game}",
                       f"--update={dummy_upd}", f"--keys={dummy_keys}"],
                      cwd=str(app_dir), env=clean_env({}), capture_output=True, text=True, timeout=30,
                  )
                  assert r5.returncode == 1, f"Expected exit 1 for invalid NSO main, got {r5.returncode}"
                  assert not (data5 / "extracted" / "exefs").exists(), "Invalid game files must not be copied"

          print("Windows ZIP validation, schema check, and headless CLI smoke tests passed")
          PY

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeV-Recomp-windows-x64
          path: build/dist-za/PokeV-Recomp-windows-x64.zip
          if-no-files-found: error

  # The Linux AppImage (tools/za/dist-linux.sh in tools/linux/Containerfile's Ubuntu 22.04 image, as
  # linux-appimage.yml). Not tested on real hardware yet: the release below is published even when this job fails.
  linux:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Linux AppImage Downloads
        uses: actions/cache@v4
        with:
          path: |
            build/zig-dl
            build/linux/src
          key: linux-appimage-dl-${{ runner.arch }}-${{ hashFiles('tools/fetch_zig.sh', 'tools/linux/build_deps.sh', 'tools/za/dist-linux.sh') }}

      - name: Cache Linux AppImage Dependencies (Ubuntu 22.04)
        uses: actions/cache@v4
        with:
          path: build/linux/x86_64/deps
          key: linux-appimage-deps-u2204-${{ runner.arch }}-${{ hashFiles('tools/linux/Containerfile', 'tools/linux/build_deps.sh') }}

      - name: Build Docker Container
        run: docker build -t za-linux-build -f tools/linux/Containerfile tools/linux

      - name: Compile AppImage
        # (the "python" link: the Makefile shader steps call a bare python, as the Windows build has it, and the image
        # only has python3. No apostrophes inside the quoted script below.)
        run: |
          docker run --rm -v "$PWD:/src" -w /src za-linux-build bash -euo pipefail -c '
            apt-get update
            apt-get install -y --no-install-recommends dotnet-sdk-8.0 python3-venv
            git config --global --add safe.directory /src
            ln -sf "$(command -v python3.12)" /usr/local/bin/python
            PYTHON=python3.12 tools/za/dist-linux.sh'

      - name: Fix Build Directory Ownership
        if: always()
        run: |
          if [ -d build ]; then
            sudo chown -R "$(id -u):$(id -g)" build
          fi

      - name: Rename Output AppImage
        run: |
          f=$(ls build/dist/*.AppImage | head -n 1)
          mv "$f" build/dist/PokeV-Recomp-linux-x86_64.AppImage

      - name: Validate Linux AppDir Manifest & Entry Point
        run: |
          set -euo pipefail
          test -x build/linux/x86_64/za-AppDir/AppRun
          test -x build/linux/x86_64/za-AppDir/usr/bin/PokeV-Recomp
          test -s build/linux/x86_64/za-AppDir/recomplauncher.json
          SCHEMA_URL="https://raw.githubusercontent.com/elripalda/RecompLauncher/7d8bc7a59d472402ada20e2fff2fbbf806e10797/docs/recomplauncher.schema.json"
          curl -fsSL "$SCHEMA_URL" -o "$RUNNER_TEMP/recomplauncher.schema.json"
          python3 -m venv "$RUNNER_TEMP/linux-rl-venv"
          "$RUNNER_TEMP/linux-rl-venv/bin/python" -m pip install -q jsonschema
          RECOMPLAUNCHER_SCHEMA="$RUNNER_TEMP/recomplauncher.schema.json" REQUIRE_RECOMPLAUNCHER_SCHEMA=1 \
            "$RUNNER_TEMP/linux-rl-venv/bin/python" -c '
          import json, os, jsonschema
          from pathlib import Path
          manifest = json.loads(Path("build/linux/x86_64/za-AppDir/recomplauncher.json").read_text(encoding="utf-8"))
          schema = json.loads(Path(os.environ["RECOMPLAUNCHER_SCHEMA"]).read_text(encoding="utf-8"))
          jsonschema.validate(instance=manifest, schema=schema)
          assert manifest["prepare"]["program"] == ["PokeV-Recomp.exe", "AppRun"]
          assert manifest["start"]["program"] == ["PokeV-Recomp.exe", "AppRun"]
          print("Linux AppDir recomplauncher.json and AppRun validated")
          '

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeV-Recomp-linux-x86_64
          path: build/dist/PokeV-Recomp-linux-x86_64.AppImage
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [windows, linux]
    permissions:
      contents: write
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tag Metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: PokeV-Recomp-windows-x64
          path: dist-release

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: PokeV-Recomp-linux-x86_64
          path: dist-release

      - name: Verify Artifacts and Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist-release
          test -s PokeV-Recomp-windows-x64.zip
          test -s PokeV-Recomp-linux-x86_64.AppImage
          rm -f SHA256SUMS
          sha256sum PokeV-Recomp-windows-x64.zip PokeV-Recomp-linux-x86_64.AppImage > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      - name: Prepare Release Body
        shell: bash
        run: |
          set -euo pipefail
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" release-body.md
          else
            cat > release-body.md <<EOF
          ## PokeV-Recomp ${GITHUB_REF_NAME}

          Native PC port of **Pokémon Violet** (4.0.0) by static recompilation. Work in progress: see the README for
          the current status and the known issues.

          ### Files
          - **Windows x64**: \`PokeV-Recomp-windows-x64.zip\`
          - **Linux x86-64**: \`PokeV-Recomp-linux-x86_64.AppImage\`
          - **Checksums**: \`SHA256SUMS\`

          No game code or game files are included: you need your own copy of the game.

          What changed in each version: \`HISTORICO_CORRECOES_E_DESENVOLVIMENTO.md\` (in Portuguese).
          EOF
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*.zip
            dist-release/*.AppImage
            dist-release/SHA256SUMS
          name: "PokeV-Recomp ${{ github.ref_name }}"
          body_path: release-body.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
