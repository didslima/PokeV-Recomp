name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (Ubuntu x86_64)
            os: ubuntu-latest
            platform: linux
          - name: Windows (MSYS2 UCRT64)
            os: windows-2022
            platform: windows
          - name: macOS (Apple Silicon)
            os: macos-latest
            platform: macos

    steps:
      - name: Configure Git Line Endings (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout Code
        uses: actions/checkout@v4

      # ---- Linux (Ubuntu) Dependencies ----
      - name: Cache Linux Dependencies
        if: matrix.platform == 'linux'
        id: linux-deps-cache
        uses: actions/cache@v4
        with:
          path: build/linux/x86_64/deps
          key: linux-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/linux/build_deps.sh') }}

      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: l
        run: |
          sudo apt-get update
          if [ "${{ steps.linux-deps-cache.outputs.cache-hit }}" = "true" ]; then
            sudo -E apt-get install -y --no-install-recommends \
              clang lld ccache pkg-config libvulkan-dev libopus-dev
          else
            sudo -E apt-get install -y --no-install-recommends \
              clang lld ccache cmake ninja-build pkg-config nasm python3-venv curl git \
              libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
              libxss-dev libxfixes-dev libxtst-dev libxkbcommon-dev \
              libwayland-dev wayland-protocols libdecor-0-dev libegl-dev \
              libdrm-dev libgbm-dev libpulse-dev libasound2-dev libpipewire-0.3-dev \
              libdbus-1-dev libudev-dev libibus-1.0-dev libvulkan-dev libopus-dev
          fi

      # ---- Windows (MSYS2 UCRT64) Dependencies ----
      - name: Setup MSYS2 UCRT64 Toolchain
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          cache: true
          install: >-
            make
            nasm
            diffutils
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-vulkan-devel
            mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-spirv-tools
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-vulkan-memory-allocator
            mingw-w64-ucrt-x86_64-opus

      - name: Configure Windows UCRT64 PATH
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          UCRT_DIR=""
          for candidate in \
            "/d/a/_temp/msys64/ucrt64/bin" \
            "/d/a/_temp/setup-msys2/msys64/ucrt64/bin" \
            "/c/msys64/msys64/ucrt64/bin" \
            "/c/msys64/ucrt64/bin" \
            "/c/hostedtoolcache/windows/msys64/ucrt64/bin"; do
            if [ -x "$candidate/clang.exe" ]; then
              UCRT_DIR="$candidate"
              break
            fi
          done
          if [ -z "$UCRT_DIR" ]; then
            UCRT_CLANG=$(find /d/a/_temp /c -maxdepth 5 -name "clang.exe" 2>/dev/null | grep -i "ucrt64/bin/clang.exe" | head -n 1 || true)
            [ -n "$UCRT_CLANG" ] && UCRT_DIR=$(dirname "$UCRT_CLANG")
          fi
          [ -n "$UCRT_DIR" ] || { echo "UCRT64 clang.exe not found"; exit 1; }
          echo "Using UCRT64 toolchain at: $UCRT_DIR"
          echo "$UCRT_DIR" >> "$GITHUB_PATH"
          echo "$(dirname "$UCRT_DIR")/usr/bin" >> "$GITHUB_PATH"

      - name: Setup Python (Windows)
        if: matrix.platform == 'windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Windows Dependencies
        if: matrix.platform == 'windows'
        uses: actions/cache@v4
        with:
          path: |
            build/deps-win
            !build/deps-win/src
          key: win-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build_deps_windows.sh') }}

      # ---- macOS (Apple Silicon) Dependencies ----
      - name: Configure Homebrew Cache
        if: matrix.platform == 'macos'
        id: brew-config
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 HOMEBREW_NO_ENV_HINTS=1
          echo "cache_dir=$(brew --cache)" >> "$GITHUB_OUTPUT"
          BREW_VER="$(sw_vers -productVersion)-$(brew --version | head -n 1)"
          KEY_HASH=$(printf '%s\nsdl3 ffmpeg opus ccache\n' "$BREW_VER" | shasum -a 256 | cut -c1-16)
          echo "key=$KEY_HASH" >> "$GITHUB_OUTPUT"

      - name: Cache macOS Homebrew Bottles
        if: matrix.platform == 'macos'
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.brew-config.outputs.cache_dir }}/downloads
            ${{ steps.brew-config.outputs.cache_dir }}/api
          key: macos-brew-${{ runner.arch }}-${{ steps.brew-config.outputs.key }}
          restore-keys: |
            macos-brew-${{ runner.arch }}-

      - name: Install macOS Dependencies
        if: matrix.platform == 'macos'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          brew install --quiet sdl3 ffmpeg opus ccache

      # ---- Compiler Cache (ccache) ----
      - name: Configure ccache
        id: ccache-config
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "windows" ]; then
            unset INCLUDE LIB LIBPATH
            CLEAN_PATH=$(echo "$PATH" | tr ':' '\n' | grep -v -i "Program Files/LLVM" | grep -v -i "Windows Kits" | tr '\n' ':')
            export PATH="$CLEAN_PATH"
            CCACHE_DIR="$(cygpath -m "$PWD/build/ccache")"
            CCACHE_BASEDIR="$(cygpath -m "$PWD")"
          else
            CCACHE_DIR="$PWD/build/ccache"
            CCACHE_BASEDIR="$PWD"
          fi
          mkdir -p "$PWD/build/ccache"
          {
            echo "CC_LAUNCHER=ccache"
            echo "CCACHE_DIR=$CCACHE_DIR"
            echo "CCACHE_BASEDIR=$CCACHE_BASEDIR"
            echo "CCACHE_NOHASHDIR=true"
            echo "CCACHE_COMPILERCHECK=content"
            echo "CCACHE_COMPRESS=true"
            echo "CCACHE_COMPRESSLEVEL=6"
            echo "CCACHE_MAXSIZE=400M"
          } >> "$GITHUB_ENV"
          COMPILER_VER="$(clang --version | head -n 2; clang++ --version | head -n 1)"
          if [ "${{ matrix.platform }}" = "linux" ]; then
            MAKE_FLAGS="$(printf 'pv:\n\t@echo "$(RTFLAGS)|$(CXXFLAGS)|$(UIFLAGS)|$(GENFLAGS)"\n' | make -s -f Makefile -f - DEPS=deps SHADERC=-lshaderc_shared GENOPT="-O1 -DGUEST_VOLATILE" pv)"
          elif [ "${{ matrix.platform }}" = "windows" ]; then
            MAKE_FLAGS="$(printf 'pv:\n\t@echo "$(RTFLAGS)|$(CXXFLAGS)|$(UIFLAGS)|$(GENFLAGS)"\n' | make -s -f Makefile -f - DEPS=deps RELEASE=1 pv)"
          else
            MAKE_FLAGS="$(printf 'pv:\n\t@echo "$(RTFLAGS)|$(CXXFLAGS)|$(UIFLAGS)|$(GENFLAGS)"\n' | make -s -f Makefile -f - pv)"
          fi
          BUILD_CFG="platform=${{ matrix.platform }};arch=${{ runner.arch }};os=${{ runner.os }};flags=$MAKE_FLAGS"
          KEY_HASH=$(printf '%s\n%s\n' "$COMPILER_VER" "$BUILD_CFG" | (sha256sum 2>/dev/null || shasum -a 256) | cut -c1-16)
          clang --version | head -n 1
          ccache --version | head -n 1
          echo "key=$KEY_HASH" >> "$GITHUB_OUTPUT"

      - name: Cache Compiler Objects (ccache)
        uses: actions/cache@v4
        with:
          path: build/ccache
          key: ccache-${{ matrix.platform }}-${{ runner.arch }}-${{ steps.ccache-config.outputs.key }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.platform }}-${{ runner.arch }}-${{ steps.ccache-config.outputs.key }}-

      - name: Reset ccache Statistics
        shell: bash
        run: ccache -z

      # ---- Platform Builds ----
      - name: Build Linux Executable
        if: matrix.platform == 'linux'
        run: |
          if [ "${{ steps.linux-deps-cache.outputs.cache-hit }}" = "true" ]; then
            PKGCHECK=0 bash tools/za/build-linux.sh
          else
            bash tools/za/build-linux.sh
          fi

      - name: Build Windows Executable
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          unset INCLUDE LIB LIBPATH
          CLEAN_PATH=$(echo "$PATH" | tr ':' '\n' | grep -v -i "Program Files/LLVM" | grep -v -i "Windows Kits" | tr '\n' ':')
          export PATH="$CLEAN_PATH"
          bash tools/build_deps_windows.sh
          make -j"$(nproc)" B=build/win DEPS="$PWD/build/deps-win" RELEASE=1 build/win/PokeV-Recomp.exe
          ! nm build/win/PokeV-Recomp.exe | grep -q ' f_70'

      - name: Build macOS Executable
        if: matrix.platform == 'macos'
        run: |
          make -j"$(sysctl -n hw.ncpu)" B=build/mac build/mac/PokeV-Recomp

      - name: Report ccache Statistics
        shell: bash
        run: ccache -s

      # ---- Automated Tests ----
      - name: Run Automated Tests
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "windows" ]; then
            unset INCLUDE LIB LIBPATH
            CLEAN_PATH=$(echo "$PATH" | tr ':' '\n' | grep -v -i "Program Files/LLVM" | grep -v -i "Windows Kits" | tr '\n' ':')
            export PATH="$CLEAN_PATH"
            which clang
            clang --version
          fi
          tests=(
            tools/test_build_cache.py
            tools/test_data_move.py
            tools/test_delete_guard.py
            tools/test_dynres.py
            tools/test_fence_sequence.py
            tools/test_field_regions.py
            tools/test_flagfuse.py
            tools/test_gamebuild_resume.py
            tools/test_game_identity.py
            tools/test_pace.py
            tools/test_recomplauncher.py
            tools/test_regpromote.py
            tools/test_save.py
            tools/test_settings.py
            tools/test_updater.py
            tools/test_vulkan_overlap.py
            tools/test_widescreen_proj.py
            tools/test_xbox_attack_prepare.py
          )
          if [ "${{ matrix.platform }}" = "linux" ]; then
            tests+=(
              tools/test_data_dir.py
              tools/test_issue22_fix.py
            )
          fi
          if [ "${{ matrix.platform }}" != "macos" ]; then
            tests+=(
              tools/test_vulkan_overlay.py
              tools/test_vulkan_sync_errors.py
              tools/test_vulkan_validation.py
            )
          fi
          if [ "${{ matrix.platform }}" = "windows" ]; then
            tests+=(
              tools/test_windows_logs.py
              tools/test_windows_processes.py
            )
          fi
          python3 - "${tests[@]}" <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          import os, subprocess, sys, time

          tests = sys.argv[1:]
          workers = max(1, min(len(tests), os.cpu_count() or 4))

          def run_one(test_path):
              t0 = time.monotonic()
              proc = subprocess.run([sys.executable, test_path], capture_output=True, text=True)
              return test_path, proc.returncode, proc.stdout, proc.stderr, time.monotonic() - t0

          t_start = time.monotonic()
          with ThreadPoolExecutor(max_workers=workers) as pool:
              results = list(pool.map(run_one, tests))

          failed = 0
          for test_path, rc, out, err, dur in results:
              print(f"=== Running {test_path} ({dur:.2f}s) ===", flush=True)
              if out:
                  sys.stdout.write(out if out.endswith("\n") else out + "\n")
              if err:
                  sys.stderr.write(err if err.endswith("\n") else err + "\n")
              if rc != 0:
                  print(f"FAIL: {test_path} exited with status {rc}", file=sys.stderr, flush=True)
                  failed += 1

          total_dur = time.monotonic() - t_start
          print(f"=== Completed {len(tests)} tests across {workers} workers in {total_dur:.2f}s ===", flush=True)
          sys.exit(1 if failed else 0)
          PY

      - name: Validate recomplauncher.json Against Official Schema
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          SCHEMA_URL="https://raw.githubusercontent.com/elripalda/RecompLauncher/7d8bc7a59d472402ada20e2fff2fbbf806e10797/docs/recomplauncher.schema.json"
          curl -fsSL "$SCHEMA_URL" -o "$RUNNER_TEMP/recomplauncher.schema.json"
          python3 -m venv "$RUNNER_TEMP/schema-venv"
          if [ -x "$RUNNER_TEMP/schema-venv/Scripts/python.exe" ]; then SPY="$RUNNER_TEMP/schema-venv/Scripts/python.exe"; else SPY="$RUNNER_TEMP/schema-venv/bin/python"; fi
          "$SPY" -m pip install -q jsonschema
          RECOMPLAUNCHER_SCHEMA="$RUNNER_TEMP/recomplauncher.schema.json" REQUIRE_RECOMPLAUNCHER_SCHEMA=1 "$SPY" tools/test_recomplauncher.py

      # The generator's own packages (pinned as in the Makefile / tools/za scripts) in a venv of their own: the jump-table
      # test imports tools/gen.py, and it fails (never skips) without them.
      - name: Generator Tests (jump tables)
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/gen-venv"
          if [ -x "$RUNNER_TEMP/gen-venv/Scripts/python.exe" ]; then GENPY="$RUNNER_TEMP/gen-venv/Scripts/python.exe"; else GENPY="$RUNNER_TEMP/gen-venv/bin/python"; fi
          "$GENPY" -m pip install -q capstone==5.0.9 unicorn==2.1.4 lz4==4.4.5
          "$GENPY" tools/test_jump_table.py
